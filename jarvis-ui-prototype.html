<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — Elastic Command Surface (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%2322d3ee' stroke-width='8'/><circle cx='50' cy='50' r='14' fill='%2322d3ee'/></svg>">
<style>
:root{
  --bg:#05080f;
  --panel:#0b1220;
  --panel-2:#0e1727;
  --line:rgba(120,190,255,.14);
  --line-2:rgba(120,190,255,.28);
  --text:#dde7f5;
  --dim:#93a6c0;
  --faint:#61748f;
  --cyan:#22d3ee;
  --cyan-soft:#67e8f9;
  --blue:#4c8dff;
  --amber:#fbbf24;
  --green:#34d399;
  --red:#f87171;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.6;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(34,211,238,.3);color:#fff}
button{font-family:inherit;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- fake desktop: what Jarvis floats over ---------- */
.desk{position:fixed;inset:0;padding:56px 48px;opacity:.5}
.desk-top{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.desk-dot{width:9px;height:9px;border-radius:50%;background:#2a3648}
.desk-tab{font-family:var(--mono);font-size:11px;color:var(--faint);
  border:1px solid var(--line);border-radius:6px;padding:4px 10px;margin-left:8px}
.desk-line{height:9px;border-radius:4px;background:rgba(120,190,255,.09);margin-bottom:13px}
.desk-line.w1{width:52%}.desk-line.w2{width:78%}.desk-line.w3{width:64%}
.desk-line.w4{width:38%}.desk-line.w5{width:71%}.desk-line.w6{width:45%}
.desk-block{height:74px;border-radius:8px;background:rgba(120,190,255,.06);
  border:1px solid var(--line);margin:22px 0}

/* ---------- scrim ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,6,12,.62);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .22s ease}
.scrim.on{opacity:1;pointer-events:auto}

/* ---------- hint ---------- */
.hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;
  font-family:var(--mono);font-size:11.5px;color:var(--faint);letter-spacing:.03em;
  transition:opacity .25s ease;z-index:5}
.hint b{color:var(--dim);font-weight:500;
  border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin:0 2px}
.hint.hide{opacity:0}

/* ---------- the surface ---------- */
.surface{
  position:fixed;left:50%;top:21vh;transform:translate(-50%,-8px) scale(.985);
  width:min(640px,calc(100vw - 32px));
  background:linear-gradient(168deg,var(--panel),#070c16);
  border:1px solid var(--line-2);border-radius:16px;
  box-shadow:0 32px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(34,211,238,.05),
             0 0 60px -18px rgba(34,211,238,.28);
  opacity:0;pointer-events:none;z-index:10;
  transition:opacity .2s ease,transform .24s var(--ease);
  overflow:hidden;
}
.surface.on{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}

/* ---------- zone A: summon bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:text}
.glyph{flex:none;width:22px;height:22px;position:relative}
.glyph svg{display:block}
.glyph .g-ring{position:absolute;inset:0}
.glyph .g-core{position:absolute;inset:0}
.glyph[data-state="listening"] .g-ring{animation:spin 3.4s linear infinite}
.glyph[data-state="planning"] .g-ring{animation:spin 1.5s linear infinite}
.glyph[data-state="executing"] .g-ring{animation:spin 1.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes softpulse{0%,100%{opacity:1}50%{opacity:.45}}
.glyph[data-state="executing"] .g-core{animation:softpulse 1.4s ease-in-out infinite}

.field{flex:1;min-width:0;display:flex;align-items:center;gap:2px}
#input{flex:1;min-width:0;background:none;border:none;outline:none;
  font-family:var(--sans);font-size:15px;color:var(--text);caret-color:var(--cyan)}
#input::placeholder{color:var(--faint)}
.caret{width:2px;height:17px;background:var(--cyan);border-radius:1px;
  animation:blink 1.1s step-end infinite;flex:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.icon-btn{flex:none;width:30px;height:30px;border-radius:8px;border:none;background:none;
  display:grid;place-items:center;transition:.15s}
.icon-btn:hover{background:rgba(120,190,255,.1)}
.icon-btn.mic.live{background:rgba(34,211,238,.16)}
.icon-btn svg{display:block}
.kbd{flex:none;font-family:var(--mono);font-size:10.5px;color:var(--faint);
  border:1px solid var(--line);border-radius:5px;padding:3px 7px;transition:.15s}
.kbd:hover{color:var(--dim);border-color:var(--line-2)}

/* ---------- collapsible zones ---------- */
.zone{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.zone.open{grid-template-rows:1fr}
.zone>.inner{overflow:hidden;min-height:0}
.zone>.inner>.pad{border-top:1px solid var(--line)}

/* ---------- zone B: response ---------- */
.voice{display:flex;align-items:center;gap:11px;padding:15px 18px 0}
.wave{display:flex;align-items:center;gap:2px;height:18px}
.wave i{display:block;width:2px;border-radius:1px;background:var(--cyan)}
.wave.live i{animation:wv .9s ease-in-out infinite}
.wave i:nth-child(1){height:5px}.wave i:nth-child(2){height:9px}
.wave i:nth-child(3){height:14px}.wave i:nth-child(4){height:18px}
.wave i:nth-child(5){height:11px}.wave i:nth-child(6){height:16px}
.wave i:nth-child(7){height:8px}.wave i:nth-child(8){height:13px}
.wave i:nth-child(9){height:6px}
.wave.live i:nth-child(1){animation-delay:0s}.wave.live i:nth-child(2){animation-delay:.09s}
.wave.live i:nth-child(3){animation-delay:.18s}.wave.live i:nth-child(4){animation-delay:.27s}
.wave.live i:nth-child(5){animation-delay:.36s}.wave.live i:nth-child(6){animation-delay:.45s}
.wave.live i:nth-child(7){animation-delay:.54s}.wave.live i:nth-child(8){animation-delay:.63s}
.wave.live i:nth-child(9){animation-delay:.72s}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.voice .lbl{font-size:12px;color:var(--dim)}
.voice .stop{margin-left:auto;font-size:12px;color:var(--dim);background:none;
  border:1px solid var(--line);border-radius:7px;padding:4px 11px;transition:.15s}
.voice .stop:hover{color:var(--text);border-color:var(--line-2);background:rgba(120,190,255,.07)}

.answer{padding:13px 18px 4px;font-size:14px;line-height:1.65;color:var(--text);min-height:1px}
.answer strong{font-weight:500;color:#fff}
.srcs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 18px 0}
.src{font-size:12px;color:var(--dim);background:rgba(120,190,255,.07);
  border:1px solid var(--line);border-radius:7px;padding:4px 9px}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:15px 18px 17px}
.btn{font-size:13px;font-weight:500;border-radius:9px;padding:8px 14px;
  border:1px solid var(--line-2);background:rgba(120,190,255,.07);color:var(--text);transition:.15s}
.btn:hover{background:rgba(120,190,255,.14);border-color:rgba(120,190,255,.42)}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));
  color:#04121a;border-color:transparent;box-shadow:0 0 22px -8px rgba(34,211,238,.9)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none;border-color:var(--line);color:var(--dim)}
.btn.ghost:hover{color:var(--text);background:rgba(120,190,255,.07)}

/* ---------- suggestions footer ---------- */
.sug{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:11px 18px;
  border-top:1px solid var(--line);transition:opacity .2s ease}
.surface.acting .sug{display:none}
.sug .lead{font-size:11px;color:var(--faint);margin-right:2px}
.chip{font-size:12.5px;color:var(--dim);background:none;border:1px solid var(--line);
  border-radius:7px;padding:5px 10px;transition:.15s}
.chip:hover{color:var(--cyan-soft);border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.09)}
.chip.sel{color:var(--cyan-soft);border-color:rgba(34,211,238,.5);background:rgba(34,211,238,.12)}

/* ---------- zone C/D: act ---------- */
.act{display:flex;flex-wrap:wrap}
.rail{flex:0 0 196px;min-width:196px;border-right:1px solid var(--line);padding:16px 16px 18px}
.rail-step{display:flex;gap:9px;align-items:flex-start;margin-bottom:14px;transition:opacity .3s ease}
.rail-step:last-child{margin-bottom:0}
.rail-step .ico{flex:none;width:13px;height:13px;margin-top:3px}
.rail-step .txt{font-size:12.5px;line-height:1.45;color:var(--faint);transition:color .3s ease}
.rail-step.done .txt{color:var(--dim)}
.rail-step.active .txt{color:var(--text);font-weight:500}
.rail-step.pending{opacity:.5}
.main{flex:1 1 280px;min-width:280px;padding:16px 18px 18px}
.work-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.work-head .t{font-size:12px;color:var(--dim);font-family:var(--mono)}

.approve{border:1px solid rgba(251,191,36,.3);border-radius:12px;padding:14px 16px;
  background:linear-gradient(150deg,rgba(251,191,36,.09),rgba(251,191,36,.02));
  opacity:0;transform:translateY(6px);
  transition:opacity .3s var(--ease),transform .3s var(--ease)}
.approve.on{opacity:1;transform:none}
.approve .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.approve h3{font-size:14px;font-weight:500;margin-bottom:10px}
.meta{font-size:12px;color:var(--dim);line-height:1.9;margin-bottom:12px}
.meta b{color:var(--faint);font-weight:400}
.draft{font-size:13px;line-height:1.6;color:var(--text);
  background:rgba(5,8,15,.62);border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;margin-bottom:14px}
.approve .row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- tray ---------- */
.tray{position:fixed;right:26px;bottom:24px;z-index:6;
  display:flex;align-items:center;gap:10px;
  background:rgba(11,18,32,.86);border:1px solid var(--line);border-radius:11px;
  padding:8px 12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:opacity .25s ease,transform .25s var(--ease)}
.tray.hide{opacity:0;transform:translateY(10px);pointer-events:none}
.tray .lbl{font-size:12px;color:var(--dim)}
.tray .kbd{margin-left:2px}
.tray:hover{border-color:var(--line-2)}

@media (max-width:640px){
  .desk{padding:32px 20px}
  .surface{top:12vh}
  .rail{flex:1 1 100%;min-width:0;border-right:none;border-bottom:1px solid var(--line)}
  .tray{right:14px;bottom:14px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .surface,.zone,.approve,.scrim{transition:opacity .01ms linear!important}
}
</style>
</head>
<body>

<h1 class="sr-only">Jarvis elastic command surface — interactive prototype</h1>

<div class="desk" aria-hidden="true">
  <div class="desk-top">
    <span class="desk-dot"></span><span class="desk-dot"></span><span class="desk-dot"></span>
    <span class="desk-tab">q3-strategy.md</span>
  </div>
  <div class="desk-line w1"></div>
  <div class="desk-line w2"></div>
  <div class="desk-line w3"></div>
  <div class="desk-block"></div>
  <div class="desk-line w4"></div>
  <div class="desk-line w5"></div>
  <div class="desk-line w2"></div>
  <div class="desk-line w6"></div>
  <div class="desk-line w3"></div>
</div>

<div class="scrim" id="scrim"></div>

<p class="hint" id="hint">
  <b>Ctrl</b>+<b>K</b> to summon &nbsp;·&nbsp; <b>&#8593;&#8595;</b> history &nbsp;·&nbsp;
  <b>Tab</b> accept suggestion &nbsp;·&nbsp; <b>Esc</b> to retreat one level
</p>

<div class="surface" id="surface" role="dialog" aria-label="Jarvis command surface" aria-modal="false">
  <div class="bar" id="bar">
    <span class="glyph" id="glyph" data-state="idle">
      <svg class="g-ring" width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#22d3ee" stroke-width="1.4" opacity=".5"
                stroke-dasharray="52 11" stroke-linecap="round"/>
      </svg>
      <svg class="g-core" width="22" height="22" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" fill="#22d3ee"/>
      </svg>
    </span>

    <div class="field">
      <input id="input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Ask anything, or tell me to do something&#8230;"
             aria-label="Ask Jarvis">
      <span class="caret" id="caret"></span>
    </div>

    <button class="icon-btn mic" id="mic" aria-label="Dictate">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#93a6c0"
           stroke-width="1.7" stroke-linecap="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/>
      </svg>
    </button>
    <button class="kbd" id="escBtn" aria-label="Dismiss">esc</button>
  </div>

  <div class="zone" id="zoneAnswer">
    <div class="inner"><div class="pad">
      <div class="voice">
        <span class="wave live" id="wave">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
        <span class="lbl" id="voiceLbl">Speaking &#183; 0:00</span>
        <button class="stop" id="stopBtn">Stop</button>
      </div>
      <p class="answer" id="answer" aria-live="polite"></p>
      <div class="srcs" id="srcs"></div>
      <div class="acts" id="acts"></div>
    </div></div>
  </div>

  <div class="zone" id="zoneAct">
    <div class="inner"><div class="pad">
      <div class="act">
        <div class="rail" id="rail"></div>
        <div class="main">
          <div class="work-head">
            <span class="t" id="workT">Working &#183; 0:00</span>
            <button class="stop" id="stopBtn2" style="margin-left:auto">Stop</button>
          </div>
          <div class="approve" id="approve">
            <p class="tag">Needs your approval</p>
            <h3 id="apprTitle">Send this reply?</h3>
            <div class="meta" id="apprMeta"></div>
            <p class="draft" id="apprDraft"></p>
            <div class="row">
              <button class="btn primary" id="doSend">Send</button>
              <button class="btn ghost" id="doEdit">Edit first</button>
              <button class="btn ghost" id="doCancel">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div></div>
  </div>

  <div class="sug" id="sug"></div>
</div>

<div class="tray" id="tray" role="button" tabindex="0" aria-label="Open Jarvis">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="9.5" stroke="#22d3ee" stroke-width="1.3" opacity=".55"/>
    <circle cx="12" cy="12" r="3.6" fill="#22d3ee"/>
  </svg>
  <span class="lbl">Jarvis</span>
  <span class="kbd">&#8984;K</span>
</div>

<script>
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };

var surface = $('surface'), scrim = $('scrim'), input = $('input'), glyph = $('glyph');
var caret = $('caret'), hint = $('hint'), tray = $('tray');
var zoneAnswer = $('zoneAnswer'), zoneAct = $('zoneAct');
var sug = $('sug'), answerEl = $('answer'), srcsEl = $('srcs'), actsEl = $('acts');
var voiceLbl = $('voiceLbl'), wave = $('wave');
var rail = $('rail'), approve = $('approve'), workT = $('workT');

var SUGGESTIONS = ['Inbox status', 'Focus mode', 'Wind down', 'Standup mode'];
var HISTORY = [];
var histIdx = -1;
var timers = [];
var speaking = false;
var mode = 'resting';

/* ---------------- content ---------------- */

var ANSWER_SEGS = [
  { t: 'Four meetings today. First is ' },
  { t: 'Design review at 9:30', b: true },
  { t: ' with Maya and Tom. The 2pm budget sync still has no agenda \u2014 want me to ask Sarah for one?' }
];

var SOURCES = ['Google Calendar \u00b7 4 events', 'Gmail \u00b7 1 thread'];
var ACTIONS = ['Ask Sarah for an agenda', 'Open in canvas'];

var ACT_STEPS = [
  "Read today's calendar",
  'Drafted a decline for Budget sync',
  'Waiting on you',
  'Send and set Slack status'
];

var APPROVAL = {
  title: 'Send this reply?',
  meta: [['To', 'sarah@acme.com'], ['Subject', 'Re: Budget sync 2pm']],
  draft: "Hi Sarah \u2014 the 2pm budget sync doesn't have an agenda yet. Could you add one before we meet, or should we push to Thursday?"
};

/* ---------------- helpers ---------------- */

function clearTimers(){
  timers.forEach(clearTimeout);
  timers = [];
}
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

function setGlyph(state){
  glyph.setAttribute('data-state', state);
  var ring = glyph.querySelector('.g-ring circle');
  var core = glyph.querySelector('.g-core circle');
  var cfg = {
    idle:      { ring: '#22d3ee', ro: '.5',  core: '#22d3ee', co: '1'  },
    listening: { ring: '#22d3ee', ro: '1',   core: '#67e8f9', co: '1'  },
    planning:  { ring: '#4c8dff', ro: '.8',  core: '#4c8dff', co: '.5' },
    executing: { ring: '#fbbf24', ro: '1',   core: '#fbbf24', co: '1'  },
    done:      { ring: '#34d399', ro: '1',   core: '#34d399', co: '1'  },
    blocked:   { ring: '#f87171', ro: '1',   core: '#f87171', co: '1'  }
  }[state] || {};
  if(cfg.ring){ ring.setAttribute('stroke', cfg.ring); ring.setAttribute('opacity', cfg.ro); }
  if(cfg.core){ core.setAttribute('fill', cfg.core); core.setAttribute('opacity', cfg.co); }
}

function open(zone){ zone.classList.add('open'); }
function close(zone){ zone.classList.remove('open'); }

function setMode(next){
  mode = next;
  if(next === 'resting'){
    surface.classList.remove('on');
    surface.classList.remove('acting');
    scrim.classList.remove('on');
    tray.classList.remove('hide');
    hint.classList.remove('hide');
    clearTimers();
    stopSpeaking();
    close(zoneAnswer); close(zoneAct);
    approve.classList.remove('on');
    input.value = '';
    input.blur();
    setGlyph('idle');
  } else {
    surface.classList.add('on');
    scrim.classList.add('on');
    tray.classList.add('hide');
    hint.classList.add('hide');
  }
}

function summon(){
  setMode('ask');
  resetSurface();
  renderSuggestions();
  setTimeout(function(){ input.focus(); }, 40);
}

function resetSurface(){
  clearTimers();
  stopSpeaking();
  surface.classList.remove('acting');
  close(zoneAnswer); close(zoneAct);
  approve.classList.remove('on');
  answerEl.innerHTML = '';
  srcsEl.innerHTML = '';
  actsEl.innerHTML = '';
  rail.innerHTML = '';
  setGlyph('idle');
  caret.style.display = 'block';
}

/* ---------------- suggestions ---------------- */

function renderSuggestions(){
  sug.innerHTML = '';
  var lead = document.createElement('span');
  lead.className = 'lead';
  lead.textContent = 'Try';
  sug.appendChild(lead);
  SUGGESTIONS.forEach(function(text, i){
    var b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = text;
    b.addEventListener('click', function(){ run(text); });
    sug.appendChild(b);
  });
}

function highlightSuggestion(dir){
  var chips = Array.prototype.slice.call(sug.querySelectorAll('.chip'));
  if(!chips.length) return;
  var cur = chips.findIndex(function(c){ return c.classList.contains('sel'); });
  var next = cur === -1 ? (dir > 0 ? 0 : chips.length - 1)
                        : (cur + dir + chips.length) % chips.length;
  chips.forEach(function(c){ c.classList.remove('sel'); });
  chips[next].classList.add('sel');
  input.value = chips[next].textContent;
  input.focus();
}

/* ---------------- speaking ---------------- */

var speakTimer = null;
function startSpeaking(){
  speaking = true;
  wave.classList.add('live');
  var t = 0;
  clearInterval(speakTimer);
  speakTimer = setInterval(function(){
    t += 1;
    voiceLbl.textContent = 'Speaking \u00b7 0:' + String(t).padStart(2, '0');
    if(t >= 6) stopSpeaking();
  }, 700);
}
function stopSpeaking(){
  speaking = false;
  clearInterval(speakTimer);
  speakTimer = null;
  wave.classList.remove('live');
  voiceLbl.textContent = 'Spoken';
}

/* ---------------- answer flow ---------------- */

function typeAnswer(){
  var si = 0, ci = 0, node = null;
  answerEl.innerHTML = '';
  function step(){
    if(si >= ANSWER_SEGS.length){ setGlyph('done'); later(function(){ setGlyph('idle'); }, 900); return; }
    var seg = ANSWER_SEGS[si];
    if(ci === 0){
      node = document.createElement(seg.b ? 'strong' : 'span');
      answerEl.appendChild(node);
    }
    node.textContent += seg.t.charAt(ci);
    ci++;
    if(ci >= seg.t.length){ si++; ci = 0; }
    later(step, 14);
  }
  step();
}

function runAnswer(){
  setMode('answer');
  setGlyph('planning');
  surface.classList.remove('acting');
  open(zoneAnswer);
  close(zoneAct);
  answerEl.innerHTML = '';
  srcsEl.innerHTML = '';
  actsEl.innerHTML = '';
  caret.style.display = 'none';

  later(function(){
    setGlyph('listening');
    startSpeaking();
    typeAnswer();
  }, 620);

  later(function(){
    SOURCES.forEach(function(s){
      var el = document.createElement('span');
      el.className = 'src';
      el.textContent = s;
      srcsEl.appendChild(el);
    });
    ACTIONS.forEach(function(a, i){
      var b = document.createElement('button');
      b.className = 'btn' + (i === 0 ? ' primary' : '');
      b.type = 'button';
      b.textContent = a;
      b.addEventListener('click', function(){
        if(i === 1){ input.value = a; runAnswer(); }
        else { input.value = 'clear my morning'; runAct(); }
      });
      actsEl.appendChild(b);
    });
  }, 1500);
}

/* ---------------- act flow ---------------- */

function railIcon(kind){
  if(kind === 'done'){
    return '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.8" stroke="#34d399" stroke-width="1.2"/><path d="M5.2 8.2l2 2 3.7-4.2" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  if(kind === 'active'){
    return '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.8" stroke="#fbbf24" stroke-width="1.2" opacity=".5"/><circle cx="8" cy="8" r="3.1" fill="#fbbf24"/></svg>';
  }
  return '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.8" stroke="rgba(120,190,255,.34)" stroke-width="1.2"/></svg>';
}

function buildRail(){
  rail.innerHTML = '';
  ACT_STEPS.forEach(function(text, i){
    var row = document.createElement('div');
    row.className = 'rail-step pending';
    row.setAttribute('data-i', i);
    var ico = document.createElement('span');
    ico.className = 'ico';
    ico.innerHTML = railIcon('pending');
    var tx = document.createElement('span');
    tx.className = 'txt';
    tx.textContent = text;
    row.appendChild(ico); row.appendChild(tx);
    rail.appendChild(row);
  });
}

function markStep(i, kind){
  var row = rail.querySelector('[data-i="' + i + '"]');
  if(!row) return;
  row.className = 'rail-step ' + kind;
  row.querySelector('.ico').innerHTML = railIcon(kind);
}

function runAct(){
  setMode('act');
  setGlyph('planning');
  surface.classList.add('acting');
  close(zoneAnswer);
  open(zoneAct);
  buildRail();
  approve.classList.remove('on');
  caret.style.display = 'none';

  var t = 0;
  var clock = setInterval(function(){
    t += 1;
    workT.textContent = 'Working \u00b7 0:' + String(t).padStart(2, '0');
  }, 1000);
  timers.push(clock);

  later(function(){ setGlyph('executing'); markStep(0, 'done'); }, 480);
  later(function(){ markStep(1, 'done'); }, 1150);
  later(function(){
    markStep(2, 'active');
    setGlyph('blocked');
    approve.classList.add('on');
  }, 1800);
}

function resolveAct(){
  clearInterval(timers.pop());
  clearTimers();
  markStep(2, 'done');
  markStep(3, 'done');
  setGlyph('done');
  workT.textContent = 'Done \u00b7 2 actions';
  approve.classList.remove('on');
  later(function(){ setMode('resting'); }, 1500);
}

/* ---------------- dispatch ---------------- */

function run(text){
  var cmd = (text || input.value).trim();
  if(!cmd) return;
  clearTimers();
  stopSpeaking();
  input.value = cmd;
  HISTORY.unshift(cmd);
  histIdx = -1;

  var acting = /clear|focus mode|block|mute|wind down|standup/i.test(cmd);
  if(acting){ runAct(); } else { runAnswer(); }
}

/* ---------------- events ---------------- */

input.addEventListener('input', function(){ caret.style.display = input.value ? 'none' : 'block'; });

input.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); run(); return; }
  if(e.key === 'Tab'){ e.preventDefault(); highlightSuggestion(e.shiftKey ? -1 : 1); return; }
  if(e.key === 'ArrowUp' && HISTORY.length){
    e.preventDefault();
    histIdx = Math.min(histIdx + 1, HISTORY.length - 1);
    input.value = HISTORY[histIdx];
    caret.style.display = 'none';
    return;
  }
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    histIdx = Math.max(histIdx - 1, -1);
    input.value = histIdx === -1 ? '' : HISTORY[histIdx];
    caret.style.display = input.value ? 'none' : 'block';
    return;
  }
});

document.addEventListener('keydown', function(e){
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    summon();
    return;
  }
  if(e.key === 'Escape'){
    if(mode === 'resting') return;
    if(mode === 'act'){ setMode('ask'); resetSurface(); renderSuggestions(); input.focus(); return; }
    if(mode === 'answer'){ setMode('ask'); resetSurface(); renderSuggestions(); input.focus(); return; }
    setMode('resting');
  }
});

$('bar').addEventListener('click', function(){ input.focus(); });
$('escBtn').addEventListener('click', function(){ setMode('resting'); });
$('stopBtn').addEventListener('click', stopSpeaking);
$('stopBtn2').addEventListener('click', function(){ setMode('resting'); });
$('mic').addEventListener('click', function(){
  var m = $('mic');
  m.classList.toggle('live');
  if(m.classList.contains('live')){
    setGlyph('listening');
    input.placeholder = 'Listening\u2026';
    input.focus();
  } else {
    setGlyph('idle');
    input.placeholder = 'Ask anything, or tell me to do something\u2026';
  }
});
scrim.addEventListener('click', function(){ setMode('resting'); });
tray.addEventListener('click', summon);
tray.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); summon(); } });

$('doSend').addEventListener('click', resolveAct);
$('doEdit').addEventListener('click', function(){
  input.value = APPROVAL.draft;
  setMode('ask'); resetSurface(); renderSuggestions(); input.focus();
});
$('doCancel').addEventListener('click', function(){ setMode('resting'); });

/* seed approval copy */
$('apprTitle').textContent = APPROVAL.title;
$('apprMeta').innerHTML = APPROVAL.meta.map(function(p){
  return '<div><b>' + p[0] + ' \u00b7 </b>' + p[1] + '</div>';
}).join('');
$('apprDraft').textContent = APPROVAL.draft;

renderSuggestions();

/* first-run: open the surface so the demo is self-evident */
setTimeout(summon, 700);

})();
</script>
</body>
